<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digi Pizza kingdom - Order Form</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <header>
    <h1>🍕 Digi Pizza kingdom</h1>
    <p id="student-info"></p>
  </header>

  <main>
    <section class="order-form-section">
      <h2>Build Your Perfect Pizza</h2>
      <form id="pizza-form" novalidate>
        <fieldset>
          <legend>Customer Information</legend>
          <div class="form-group">
            <label for="customerName">Full Name <span class="required">*</span></label>
            <input type="text" id="customerName" name="customerName" required minlength="2" placeholder="John Doe">
            <span class="error" id="customerName-error"></span>
          </div>
          <div class="form-group">
            <label for="phone">Phone Number <span class="required">*</span></label>
            <input type="tel" id="phone" name="phone" required pattern="[0-9]{10}" placeholder="1234567890">
            <span class="error" id="phone-error"></span>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com">
            <span class="error" id="email-error"></span>
          </div>
        </fieldset>
