<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digi Pizza kingdom - Order Form</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <header>
    <h1>🍕 Digi Pizza kingdom</h1>
    <p id="student-info"></p>
  </header>

  <main>
    <section class="order-form-section">
      <h2>Build Your Perfect Pizza</h2>
      <form id="pizza-form" novalidate>
        <fieldset>
          <legend>Customer Information</legend>
          <div class="form-group">
            <label for="customerName">Full Name <span class="required">*</span></label>
            <input type="text" id="customerName" name="customerName" required minlength="2" placeholder="John Doe">
            <span class="error" id="customerName-error"></span>
          </div>
          <div class="form-group">
            <label for="phone">Phone Number <span class="required">*</span></label>
            <input type="tel" id="phone" name="phone" required pattern="[0-9]{10}" placeholder="1234567890">
            <span class="error" id="phone-error"></span>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com">
            <span class="error" id="email-error"></span>
          </div>
        </fieldset>

        <label><input type="radio" name="size" value='Small (10")' required> Small (10") - $9.99</label>
<label><input type="radio" name="size" value='Medium (12")'> Medium (12") - $12.99</label>
<label><input type="radio" name="size" value='Large (14")'> Large (14") - $15.99</label>
<label><input type="radio" name="size" value='Extra Large (16")'> Extra Large (16") - $18.99</label>

<fieldset>
          <legend>Crust Type <span class="required">*</span></legend>
          <select id="crust" name="crust" required>
            <option value="">-- Select Crust --</option>
            <option value="Thin & Crispy">Thin & Crispy</option>
            <option value="Classic Hand-Tossed">Classic Hand-Tossed</option>
            <option value="Thick Pan">Thick Pan</option>
            <option value="Stuffed Crust">Stuffed Crust (+$2.50)</option>
            <option value="Gluten-Free">Gluten-Free (+$3.00)</option>
          </select>
          <span class="error" id="crust-error"></span>
        </fieldset>

        <fieldset>
          <legend>Sauce <span class="required">*</span></legend>
          <select id="sauce" name="sauce" required>
            <option value="">-- Select Sauce --</option>
            <option value="Classic Tomato">Classic Tomato</option>
            <option value="Garlic Parmesan">Garlic Parmesan</option>
            <option value="BBQ">BBQ</option>
            <option value="Pesto">Pesto</option>
            <option value="Buffalo">Buffalo</option>
            <option value="No Sauce you monster">No Sauce you monster</option>
          </select>
          <span class="error" id="sauce-error"></span>
        </fieldset>

        <fieldset>
          <legend>Cheese</legend>
          <div class="checkbox-group">
            <label><input type="checkbox" name="cheese" value="Mozzarella"> Mozzarella</label>
            <label><input type="checkbox" name="cheese" value="Cheddar"> Cheddar</label>
            <label><input type="checkbox" name="cheese" value="Provolone"> Provolone</label>
            <label><input type="checkbox" name="cheese" value="Vegan Cheese"> Vegan Cheese</label>
            <label><input type="checkbox" name="cheese" value="Extra Cheese"> Extra Cheese (+$1.50)</label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Toppings (select at least one) <span class="required">*</span></legend>
          <div class="checkbox-group toppings">
            <label><input type="checkbox" name="toppings" value="Pepperoni"> Pepperoni</label>
            <label><input type="checkbox" name="toppings" value="Mushrooms"> Mushrooms</label>
            <label><input type="checkbox" name="toppings" value="Onions"> Onions</label>
            <label><input type="checkbox" name="toppings" value="Green Peppers"> Green Peppers</label>
            <label><input type="checkbox" name="toppings" value="Black Olives"> Black Olives</label>
            <label><input type="checkbox" name="toppings" value="Pineapple"> Pineapple</label>
            <label><input type="checkbox" name="toppings" value="Jalapeños"> Jalapeños</label>
            <label><input type="checkbox" name="toppings" value="Bacon"> Bacon</label>
            <label><input type="checkbox" name="toppings" value="Chicken"> Chicken</label>
            <label><input type="checkbox" name="toppings" value="Spinach"> Spinach</label>
          </div>
          <span class="error" id="toppings-error"></span>
        </fieldset>

        <fieldset>
          <legend>Order Details</legend>
          <div class="form-group">
            <label for="quantity">Quantity <span class="required">*</span></label>
            <input type="number" id="quantity" name="quantity" min="1" max="10" value="1" required>
            <span class="error" id="quantity-error"></span>
          </div>
          <div class="form-group">
            <label for="instructions">Special Instructions</label>
            <textarea id="instructions" name="instructions" rows="3" placeholder="e.g. Light sauce, cut into squares..."></textarea>
          </div>
        </fieldset>
        <button type="submit" id="order-btn">Place Order</button>
        <button type="reset">Clear Form</button>
      </form>
    </section>
