<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digi Pizza kingdom - Order Form</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <header>
    <h1>🍕 Digi Pizza kingdom</h1>
    <p id="student-info"></p>
  </header>

  <main>
    <section class="order-form-section">
      <h2>Build Your Perfect Pizza</h2>
      <form id="pizza-form" novalidate>
        <fieldset>
          <legend>Customer Information</legend>
          <div class="form-group">
            <label for="customerName">Full Name <span class="required">*</span></label>
            <input type="text" id="customerName" name="customerName" required minlength="2" placeholder="John Doe">
            <span class="error" id="customerName-error"></span>
          </div>
          <div class="form-group">
            <label for="phone">Phone Number <span class="required">*</span></label>
            <input type="tel" id="phone" name="phone" required pattern="[0-9]{10}" placeholder="1234567890">
            <span class="error" id="phone-error"></span>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com">
            <span class="error" id="email-error"></span>
          </div>
        </fieldset>

        <label><input type="radio" name="size" value='Small (10")' required> Small (10") - $9.99</label>
<label><input type="radio" name="size" value='Medium (12")'> Medium (12") - $12.99</label>
<label><input type="radio" name="size" value='Large (14")'> Large (14") - $15.99</label>
<label><input type="radio" name="size" value='Extra Large (16")'> Extra Large (16") - $18.99</label>

<fieldset>
          <legend>Crust Type <span class="required">*</span></legend>
          <select id="crust" name="crust" required>
            <option value="">-- Select Crust --</option>
            <option value="Thin & Crispy">Thin & Crispy</option>
            <option value="Classic Hand-Tossed">Classic Hand-Tossed</option>
            <option value="Thick Pan">Thick Pan</option>
            <option value="Stuffed Crust">Stuffed Crust (+$2.50)</option>
            <option value="Gluten-Free">Gluten-Free (+$3.00)</option>
          </select>
          <span class="error" id="crust-error"></span>
        </fieldset>
